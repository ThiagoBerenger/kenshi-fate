  <path d="M16 36 C22 36, 28 32, 36 32 C42 32, 48 35, 52 32 L46 38 C42 42, 32 44, 26 44 L16 36 Z" fill="currentColor" fill-opacity="0.1" />
  
  <!-- Head of the dove -->
