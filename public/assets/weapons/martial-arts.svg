<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer circle for emblem/crest look -->
  <circle cx="32" cy="32" r="28" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />
  
  <!-- Knuckles (4 circles aligned horizontally-ish) -->
  <path d="M18 28 C18 24 23 24 24 28 C24 24 29 24 30 28 C30 24 35 24 36 28 C36 25 41 25 42 29" stroke-width="3" />
  
  <!-- Fist body (main block representing folded fingers) -->
  <path d="M18 28 L18 42 C18 45 22 47 32 47 C42 47 46 45 46 42 L46 29" stroke-width="3" fill="currentColor" fill-opacity="0.1" />
  
  <!-- Thumb folded across the bottom of the fingers -->
  <path d="M14 36 C14 42 22 44 26 42 L42 42" stroke-width="3" />
  
  <!-- Wrist lines extending down -->
  <path d="M26 47 L26 56" stroke-width="3" />
  <path d="M38 47 L38 56" stroke-width="3" />

  <!-- Action/Impact sparks -->
  <path d="M32 12 L32 18" stroke-width="2.5" />
  <path d="M12 20 L17 23" stroke-width="2.5" />
  <path d="M52 20 L47 23" stroke-width="2.5" />
</svg>
